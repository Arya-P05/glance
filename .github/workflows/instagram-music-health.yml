name: Instagram music scheduler
on:
  push:
    branches: [codex/instagram-music-worker]
    paths: [.github/workflows/instagram-music-health.yml]
  workflow_dispatch:
    inputs:
      mode:
        description: Health check or publish the latest due slot
        type: choice
        default: health
        options: [health, publish]
  schedule:
    # Poll throughout the day; Supabase enforces slots, catch-up limits and deduplication.
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: instagram-music
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publisher
        run: pip install -r backend/instagram-worker/requirements.txt
      - name: Validate cloud session without publishing
        if: github.event_name != 'schedule' && inputs.mode != 'publish'
        env:
          SUPABASE_URL: ${{ secrets.IG_MUSIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.IG_MUSIC_SUPABASE_KEY }}
          INSTAGRAM_USERNAME: dailyglance
        run: python backend/instagram-worker/cloud.py --health
      - name: Publish the due queue slot
        if: github.event_name == 'schedule' || inputs.mode == 'publish'
        env:
          SUPABASE_URL: ${{ secrets.IG_MUSIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.IG_MUSIC_SUPABASE_KEY }}
          INSTAGRAM_USERNAME: dailyglance
        run: python backend/instagram-worker/cloud.py
